  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
(async () => {
  // Remembered devices keep the derived key (not the password); a new build with a new salt asks again.
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved && saved.salt === P.salt) {
      const key = await crypto.subtle.importKey("raw", b64(saved.k), "AES-GCM", false, ["decrypt"]);
      return await unlock(key);
    }
  } catch { try { localStorage.removeItem(KEY); } catch {} }
})();
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Unlocking…"; err.textContent = "";
  try {
    const key = await fromPassword(document.getElementById("pw").value);
    const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
    await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data)); // throws if wrong
    if (document.getElementById("remember").checked) {
      try { localStorage.setItem(KEY, JSON.stringify({ salt: P.salt, k: btoa(String.fromCharCode(...raw)) })); } catch {}
    }
    await unlock(key);
  } catch {
    err.textContent = "That password didn't work."; btn.disabled = false; btn.textContent = "Open";
  }
});
</script>
